<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#070a14" />
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.6" />
  <text x="50" y="65" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="900" fill="url(#grad)" filter="url(#glow)" text-anchor="middle" letter-spacing="-2">DP</text>
</svg>